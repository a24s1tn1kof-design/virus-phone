<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Внимание</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #0f0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0;
    overflow: hidden;
    position: relative;
  }

  /* ===== Эффект 5: дрожание экрана ===== */
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25%     { transform: translate(-4px, 3px); }
    50%     { transform: translate(4px, -3px); }
    75%     { transform: translate(-3px, -3px); }
  }
  body.shake { animation: shake 0.35s; }

  /* ===== Иконка "треугольник с !" ===== */
  .warn-icon {
    display: inline-block;
    width: 44px; height: 44px;
    position: relative;
    vertical-align: middle;
    margin: 0 8px;
  }
  .warn-icon::before {
    content: ''; position: absolute; inset: 0;
    background: red;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .warn-icon::after {
    content: '!'; position: absolute;
    top: 55%; left: 50%;
    transform: translate(-50%, -50%);
    color: #000; font-weight: bold;
    font-size: 22px; font-family: Arial, sans-serif;
  }

  /* ===== Иконка "крестик" ===== */
  .cross-icon {
    display: inline-block;
    width: 32px; height: 32px;
    position: relative;
    vertical-align: middle;
    margin-right: 10px;
  }
  .cross-icon::before,
  .cross-icon::after {
    content: ''; position: absolute;
    top: 50%; left: 0;
    width: 100%; height: 4px;
    background: #ff2b2b; border-radius: 2px;
  }
  .cross-icon::before { transform: rotate(45deg); }
  .cross-icon::after  { transform: rotate(-45deg); }

  /* ===== Экран 1: предупреждение ===== */
  #warning-screen {
    max-width: 640px;
    padding: 20px;
  }
  .alert-title {
    color: red;
    font-size: 26px;
    font-weight: bold;
    animation: blink 1s infinite;
    margin-bottom: 30px;
    line-height: 1.6;
  }
  .alert-text {
    color: #0f0;
    font-size: 18px;
    margin-bottom: 40px;
    line-height: 1.6;
  }
  #start-btn {
    background: red;
    color: #fff;
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    padding: 20px 40px;
    border: 3px solid #ff5555;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255,0,0,0.8);
    animation: pulse 1.5s infinite;
  }
  #start-btn:active { transform: scale(0.96); }
  @keyframes blink { 50% { opacity: 0.15; } }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 25px rgba(255,0,0,0.8); }
    50%     { box-shadow: 0 0 45px rgba(255,0,0,1); }
  }

  /* ===== Фиксированная шапка ===== */
  #top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 10px 14px;
    background: #000;
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  /* Инфо об устройстве */
  #device-info {
    color: #0f0;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,0.95);
    padding: 8px 12px;
    border: 1px solid #0f0;
    border-radius: 6px;
    text-align: left;
    line-height: 1.5;
    white-space: pre;
  }

  /* Счётчик файлов */
  #file-counter {
    color: #ff2b2b;
    font-size: 14px;
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,0.95);
    padding: 6px 12px;
    border: 1px solid #ff2b2b;
    border-radius: 6px;
    align-self: flex-end;
    display: none;
  }

  /* ===== Экран 2: терминал ===== */
  #terminal-screen {
    display: none;
    width: 100%;
    height: 100vh;
    padding: 150px 20px 40px 20px;
    text-align: left;
    font-size: 16px;
    line-height: 1.7;
    overflow-y: auto;
    scroll-behavior: smooth;
    position: relative;
  }
  #terminal-screen p {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .green { color: #0f0; }
  .red   { color: #ff2b2b; }

  /* ===== Эффект 13: мигающий курсор ===== */
  .cursor {
    display: inline-block;
    width: 10px;
    height: 1em;
    background: #0f0;
    vertical-align: text-bottom;
    animation: cursorBlink 0.7s steps(1) infinite;
  }
  @keyframes cursorBlink { 50% { opacity: 0; } }

  /* ===== Экран 3: финал ===== */
  #final-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 25px;
    padding: 20px;
  }
  #final-screen .final-text {
    color: #0f0;
    font-size: 26px;
    font-weight: bold;
    line-height: 1.5;
    display: flex;
    align-items: center;
    gap: 10px;
  }
</style>
</head>
<body>

  <!-- ЭКРАН 1: предупреждение -->
  <div id="warning-screen">
    <div class="alert-title">
      <span class="warn-icon"></span>
      ВНИМАНИЕ
      <span class="warn-icon"></span>
      <br>
      ВАШ ТЕЛЕФОН ЗАРАЖЁН!
    </div>
    <div class="alert-text">
      Все ваши данные находятся под угрозой.<br>
      Нажмите на кнопку ниже, чтобы убрать вирус.
    </div>
    <button id="start-btn">УБРАТЬ ВИРУС</button>
  </div>

  <!-- ЭКРАН 2: терминал -->
  <div id="terminal-screen"></div>

  <!-- Фиксированная шапка -->
  <div id="top-bar">
    <div id="device-info"></div>
    <div id="file-counter">Удалено файлов: 0</div>
  </div>

  <!-- ЭКРАН 3: финал -->
  <div id="final-screen">
    <div class="final-text">
      <span class="cross-icon"></span>
      Вирус удален! Закройте вкладку!
    </div>
    <button id="close-btn" style="
      margin-top:20px;
      background:#0f0;color:#000;
      font-family:inherit;font-size:18px;font-weight:bold;
      padding:16px 38px;border:none;border-radius:12px;
      cursor:pointer;box-shadow:0 0 20px rgba(0,255,0,0.7);
    ">ЗАКРЫТЬ ВКЛАДКУ</button>
  </div>

<script>
  // ==========================================================
  // Получаем элементы
  // ==========================================================
  const warningScreen  = document.getElementById('warning-screen');
  const terminalScreen = document.getElementById('terminal-screen');
  const finalScreen    = document.getElementById('final-screen');
  const startBtn       = document.getElementById('start-btn');
  const closeBtn       = document.getElementById('close-btn');
  const topBar         = document.getElementById('top-bar');
  const fileCounter    = document.getElementById('file-counter');
  const deviceInfo     = document.getElementById('device-info');

  // ==========================================================
  // ЭФФЕКТ 5: дрожание экрана
  // ==========================================================
  function shakeScreen() {
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 350);
  }

  // ==========================================================
  // ЭФФЕКТ 9: ASCII-прогресс-бар
  // ==========================================================
  function makeBar(pct) {
    const filled = Math.round(pct / 5);
    return '[' + '█'.repeat(filled) + '░'.repeat(20 - filled) + ']';
  }

  // ==========================================================
  // ЭФФЕКТ 11: счётчик удалённых файлов
  // ==========================================================
  let fileCount = 0;
  let counterTimer = null;

  function startCounter() {
    counterTimer = setInterval(() => {
      fileCount += Math.floor(Math.random() * 40) + 10;
      fileCounter.textContent = 'Удалено файлов: ' + fileCount;
    }, 120);
  }

  function stopCounter() {
    if (counterTimer) clearInterval(counterTimer);
    counterTimer = null;
  }

  // ==========================================================
  // ЭФФЕКТ 12: инфо об устройстве (phone / tablet / computer)
  // ==========================================================
  function detectDeviceType() {
    const ua = navigator.userAgent;

    // === Планшет ===
    if (/iPad/.test(ua)) return 'tablet';
    if (/Macintosh/.test(ua) && 'ontouchend' in document) return 'tablet';
    if (/Android/.test(ua) && !/Mobile/.test(ua)) return 'tablet';

    // === Телефон ===
    if (/iPhone/.test(ua)) return 'phone';
    if (/Android/.test(ua) && /Mobile/.test(ua)) return 'phone';
    if (/Windows Phone/.test(ua)) return 'phone';
    if (/BlackBerry|BB10|Opera Mini|IEMobile/.test(ua)) return 'phone';

    // === ПК / ноутбук ===
    if (/Windows NT/.test(ua)) return 'computer';
    if (/Macintosh/.test(ua)) return 'computer';
    if (/Linux/.test(ua) && !/Android/.test(ua)) return 'computer';
    if (/CrOS/.test(ua)) return 'computer';

    return 'computer';
  }

  function getRandomIP() {
    return '192.168.' + rand(0,255) + '.' + rand(0,255);
  }

  function getRandomGeo() {
    const cities = [
      'Москва, Россия',
      'Санкт-Петербург, Россия',
      'Казань, Россия',
      'Новосибирск, Россия'
    ];
    return cities[Math.floor(Math.random() * cities.length)];
  }

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function buildDeviceInfo() {
    const type = detectDeviceType();
    const ip   = getRandomIP();
    const geo  = getRandomGeo();

    deviceInfo.textContent =
      'IP:        ' + ip + '\n' +
      'Устройство: ' + type + '\n' +
      'Локация:   ' + geo;
  }

  // ==========================================================
  // ЭФФЕКТ 13: мигающий курсор
  // ==========================================================
  let cursorEl = null;

  function attachCursor() {
    if (cursorEl) cursorEl.remove();
    cursorEl = document.createElement('span');
    cursorEl.className = 'cursor';
    terminalScreen.appendChild(cursorEl);
  }

  // ==========================================================
  // Печать строк
  // ==========================================================
  function printLine(text, cssClass, withBar) {
    if (cursorEl) cursorEl.remove();

    const p = document.createElement('p');

    if (cssClass === 'mixed') {
      p.innerHTML =
        '<span class="red">- Z.E.R.O.A.I</span> ' +
        '<span class="green">- запущен</span>';
    } else if (withBar && /^\-\s\d+%$/.test(text)) {
      const pct = parseInt(text.match(/\d+/)[0], 10);
      p.className = cssClass;
      p.textContent = text + ' ' + makeBar(pct);
    } else {
      p.className = cssClass;
      p.textContent = text;
    }

    terminalScreen.appendChild(p);
    attachCursor();
    terminalScreen.scrollTop = terminalScreen.scrollHeight;
  }

  // ==========================================================
  // Сценарий (~5 минут)
  // ==========================================================
  const script = [
    ['- Запуск системы', 'green', 3000],

    ['- 0%',  'green', 11000],
    ['- 15%', 'green', 11000],
    ['- 26%', 'green', 11000],
    ['- 33%', 'green', 11000],
    ['- 52%', 'green', 11000],
    ['- 68%', 'green', 11000],
    ['- 82%', 'green', 11000],
    ['- 93%', 'green', 11000],
    ['- 99%', 'green', 11000],
    ['- 100%','green', 4000],

    ['- Система загружена', 'green', 5000],

    ['- Запуск антивируса Z.E.R.O.A.I v1.0', 'green', 5000],
    ['- Z.E.R.O.A.I - запущен', 'mixed', 5000],

    // Эффект 5: тряска на "Удаление данных"
    ['- Удаление данных телефона', 'red', 5000, 'shake'],

    ['- 0%',  'green', 11000],
    ['- 15%', 'green', 11000],
    ['- 26%', 'green', 11000],
    ['- 33%', 'green', 11000],
    ['- 52%', 'green', 11000],
    ['- 68%', 'green', 11000],
    ['- 82%', 'green', 11000],
    ['- 93%', 'green', 11000],
    ['- 99%', 'green', 11000],
    ['- 100%','green', 4000],

    ['- Удаление данных успешно завершено!', 'green', 4000],
    ['- Вирус удален с устройства',          'green', 4000],
    ['- Закрытие программы',                 'green', 4000],
    ['- Программа закрыта',                  'red',   3000],
  ];

  // ==========================================================
  // Запуск последовательности
  // ==========================================================
  function runSequence() {
    let i = 0;

    function next() {
      if (i >= script.length) {
        stopCounter();

        // Эффект 18: финальная "перезагрузка"
        setTimeout(() => {
          terminalScreen.style.display = 'none';
          topBar.style.display = 'none';
          fileCounter.style.display = 'none';

          document.body.style.background = '#000';

          setTimeout(() => {
            finalScreen.style.display = 'flex';
          }, 1000);
        }, 1500);
        return;
      }

      const item = script[i];
      const [text, cls, delay, action] = item;

      printLine(text, cls, true);

      if (action === 'shake') shakeScreen();

      if (text === '- Удаление данных телефона') {
        startCounter();
      }

      i++;
      setTimeout(next, delay);
    }

    next();
  }

  // ==========================================================
  // Кнопка "УБРАТЬ ВИРУС"
  // ==========================================================
  startBtn.addEventListener('click', () => {
    warningScreen.style.display  = 'none';
    terminalScreen.style.display = 'block';

    // Показываем фиксированную шапку сразу
    buildDeviceInfo();
    topBar.style.display = 'flex';
    fileCounter.style.display = 'block';
    fileCounter.textContent = 'Удалено файлов: 0';

    runSequence();
  });

  // ==========================================================
  // ЭФФЕКТ 19: кнопка "ЗАКРЫТЬ ВКЛАДКУ"
  // ==========================================================
  closeBtn.addEventListener('click', () => {
    window.close();

    setTimeout(() => {
      document.body.innerHTML =
        '<div style="text-align:center;color:#0f0;' +
        'font-family:monospace;font-size:22px;padding:40px;line-height:1.6">' +
        'Закройте вкладку вручную' +
        '</div>';
    }, 400);
  });
</script>

</body>
 </html>
