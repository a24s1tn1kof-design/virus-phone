<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Внимание</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #0f0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0;
    overflow: hidden;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  button {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    outline: none;
  }

  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25%     { transform: translate(-4px, 3px); }
    50%     { transform: translate(4px, -3px); }
    75%     { transform: translate(-3px, -3px); }
  }
  body.shake { animation: shake 0.35s; }

  .warn-icon {
    display: inline-block;
    width: 44px; height: 44px;
    position: relative;
    vertical-align: middle;
    margin: 0 8px;
  }
  .warn-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    background: red;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .warn-icon::after {
    content: '!';
    position: absolute;
    top: 55%; left: 50%;
    transform: translate(-50%, -50%);
    color: #000;
    font-weight: bold;
    font-size: 22px;
    font-family: Arial, sans-serif;
  }

  /* ===== Экран 1: предупреждение ===== */
  #warning-screen {
    max-width: 640px;
    padding: 20px;
  }
  .alert-title {
    color: red;
    font-size: 26px;
    font-weight: bold;
    animation: blink 1s infinite;
    margin-bottom: 30px;
    line-height: 1.6;
  }
  .alert-text {
    color: #0f0;
    font-size: 18px;
    margin-bottom: 40px;
    line-height: 1.6;
  }
  #start-btn {
    background: red;
    color: #fff;
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    padding: 20px 40px;
    border: 3px solid #ff5555;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255,0,0,0.8);
    animation: pulse 1.5s infinite;
  }
  #start-btn:active { transform: scale(0.96); }
  @keyframes blink { 50% { opacity: 0.15; } }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 25px rgba(255,0,0,0.8); }
    50%     { box-shadow: 0 0 45px rgba(255,0,0,1); }
  }

  /* ===== Шапка ===== */
  #top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 10px 14px;
    background: #000;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  #device-info {
    color: #0f0;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,0.95);
    padding: 8px 12px;
    border: 1px solid #0f0;
    border-radius: 6px;
    text-align: left;
    line-height: 1.5;
    white-space: pre;
  }
  #header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  #speedup-btn {
    display: inline-block;
    background: transparent;
    color: #ffcc00;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    padding: 8px 14px;
    border: 1px solid #ffcc00;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    width: 140px;
    min-width: 140px;
    max-width: 140px;
    overflow: hidden;
    text-align: center;
  }
  #speedup-btn:active {
    background: rgba(255,204,0,0.15);
  }
  #file-counter {
    color: #ff2b2b;
    font-size: 14px;
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,0.95);
    padding: 6px 12px;
    border: 1px solid #ff2b2b;
    border-radius: 6px;
    display: none;
    white-space: nowrap;
    width: 185px;
    min-width: 185px;
    max-width: 185px;
    overflow: hidden;
    text-align: right;
  }

  /* ===== Терминал ===== */
  #terminal-screen {
    display: none;
    width: 100%;
    height: 100vh;
    padding: 160px 20px 40px 20px;
    text-align: left;
    font-size: 16px;
    line-height: 1.7;
    overflow-y: auto;
    scroll-behavior: smooth;
    position: relative;
  }
  #terminal-screen p {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .green  { color: #0f0; }
  .red    { color: #ff2b2b; }
  .yellow { color: #ffcc00; }

  .cursor {
    display: inline-block;
    width: 10px;
    height: 1em;
    background: #0f0;
    vertical-align: text-bottom;
    animation: cursorBlink 0.7s steps(1) infinite;
  }
  @keyframes cursorBlink {
    50% { opacity: 0; }
  }

  /* ===== Модалка ускорения ===== */
  #speedup-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #speedup-modal .box {
    background: #000;
    border: 2px solid #ffcc00;
    border-radius: 10px;
    padding: 25px 20px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 40px rgba(255,204,0,0.5);
  }
  #speedup-modal .box .title {
    color: #ffcc00;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  #speedup-modal .box .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  #speedup-modal button {
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    padding: 12px 22px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
  }
  #speedup-yes {
    background: #ffcc00;
    color: #000;
    box-shadow: 0 0 15px rgba(255,204,0,0.7);
  }
  #speedup-no {
    background: #222;
    color: #ff2b2b;
    border: 1px solid #ff2b2b;
  }
  #speedup-modal button:active {
    transform: scale(0.96);
  }

  /* ===== Финальный экран ===== */
  #final-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 40px 20px;
    width: 100%;
    height: 100vh;
    text-align: center;
  }
  .check-icon {
    width: 90px;
    height: 90px;
    position: relative;
  }
  .check-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 5px solid #0f0;
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(0,255,0,0.8),
                inset 0 0 15px rgba(0,255,0,0.3);
  }
  .check-icon::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 48%;
    width: 45px;
    height: 22px;
    border-left: 6px solid #0f0;
    border-bottom: 6px solid #0f0;
    transform: translate(-50%, -60%) rotate(-45deg);
    filter: drop-shadow(0 0 8px rgba(0,255,0,0.9));
  }
  #final-screen .final-text {
    color: #0f0;
    font-size: 26px;
    font-weight: bold;
    line-height: 1.5;
    text-align: center;
  }
  #close-btn {
    background: #0f0;
    color: #000;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    padding: 16px 38px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,255,0,0.7);
  }
  #close-btn:active {
    transform: scale(0.96);
  }

  /* ===== Экран "закройте вручную" ===== */
  #warning-exit-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100vh;
    padding: 40px 25px;
    text-align: center;
    background: #000;
  }
  #warning-exit-screen .warning-exit-text {
    color: #ff2b2b;
    font-size: 26px;
    font-weight: bold;
    line-height: 1.6;
    text-align: center;
    text-shadow: 0 0 15px rgba(255,0,0,0.7);
  }
</style>
</head>
<body>

  <!-- ЭКРАН 1: предупреждение -->
  <div id="warning-screen">
    <div class="alert-title">
      <span class="warn-icon"></span>
      ВНИМАНИЕ
      <span class="warn-icon"></span>
      <br>
      ВАШ ТЕЛЕФОН ЗАРАЖЁН!
    </div>
    <div class="alert-text">
      Все ваши данные находятся под угрозой.<br>
      Нажмите на кнопку ниже, чтобы убрать вирус.
    </div>
    <button id="start-btn">УБРАТЬ ВИРУС</button>
  </div>

  <!-- ЭКРАН 2: терминал -->
  <div id="terminal-screen"></div>

  <!-- Фиксированная шапка -->
  <div id="top-bar">
    <div id="device-info"></div>
    <div id="header-row">
      <button id="speedup-btn">[ УСКОРИТЬ ]</button>
      <div id="file-counter">Удалено файлов: 0</div>
    </div>
  </div>

  <!-- Модалка ускорения -->
  <div id="speedup-modal">
    <div class="box">
      <div class="title" id="speedup-modal-title">
        Ускорение может работать некорректно.<br>
        Продолжить?
      </div>
      <div class="buttons">
        <button id="speedup-yes">АКТИВИРОВАТЬ</button>
        <button id="speedup-no">ОТКЛОНИТЬ</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 3: финал -->
  <div id="final-screen">
    <div class="check-icon"></div>
    <div class="final-text">
      Вирус удален!<br>
      Закройте вкладку!
    </div>
    <button id="close-btn">ЗАКРЫТЬ ВКЛАДКУ</button>
  </div>

  <!-- Экран "закройте вручную" -->
  <div id="warning-exit-screen">
    <div class="warning-exit-text">
      Закройте вкладку вручную<br>
      и не заходите на данный сайт никогда
    </div>
  </div>
<script>
  // ==========================================================
  // Элементы
  // ==========================================================
  const warningScreen  = document.getElementById('warning-screen');
  const terminalScreen = document.getElementById('terminal-screen');
  const finalScreen    = document.getElementById('final-screen');
  const warningExit    = document.getElementById('warning-exit-screen');
  const startBtn       = document.getElementById('start-btn');
  const closeBtn       = document.getElementById('close-btn');
  const topBar         = document.getElementById('top-bar');
  const fileCounter    = document.getElementById('file-counter');
  const deviceInfo     = document.getElementById('device-info');
  const speedupBtn     = document.getElementById('speedup-btn');
  const speedupModal   = document.getElementById('speedup-modal');
  const speedupYes     = document.getElementById('speedup-yes');
  const speedupNo      = document.getElementById('speedup-no');
  const speedupTitle   = document.getElementById('speedup-modal-title');

  // ==========================================================
  // Состояние
  // ==========================================================
  let speedMode    = false;
  let aborted      = false;
  let timeouts     = [];
  let counterTimer = null;
  let fileCount    = 0;
  let stoppedAt    = -1;

  // ==========================================================
  // ЭФФЕКТ 1 и 2: Аудио через Web Audio API
  // ==========================================================
  let audioCtx    = null;
  let humOsc      = null;
  let humGain     = null;
  let audioReady  = false;

  function initAudio() {
    if (audioReady) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioReady = true;
    } catch (e) {
      audioReady = false;
    }
  }

  // Короткий "бип" (эффект 1)
  function beep(freq = 800, dur = 45, volume = 0.04) {
    if (!audioReady || !audioCtx) return;
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur / 1000);
    osc.start();
    osc.stop(audioCtx.currentTime + dur / 1000);
  }

  // Фоновый гул сервера (эффект 2)
  function startHum() {
    if (!audioReady || !audioCtx) return;
    if (humOsc) return;
    humOsc  = audioCtx.createOscillator();
    humGain = audioCtx.createGain();
    humOsc.type = 'sawtooth';
    humOsc.frequency.value = 55;
    humGain.gain.value = 0.015;
    humOsc.connect(humGain);
    humGain.connect(audioCtx.destination);
    humOsc.start();
  }

  function stopHum() {
    try {
      if (humOsc) {
        humOsc.stop();
        humOsc.disconnect();
        humOsc = null;
      }
    } catch (e) {}
  }

  // Звук "удаления файла" (эффект 3) — резкий шум
  function deletionSound() {
    if (!audioReady || !audioCtx) return;
    const bufferSize = audioCtx.sampleRate * 0.15;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const src  = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1200;
    src.buffer = buffer;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.value = 0.15;
    src.start();
  }

  // Звук успеха в финале
  function successSound() {
    if (!audioReady || !audioCtx) return;
    const notes = [523, 659, 784];
    notes.forEach((freq, i) => {
      setTimeout(() => beep(freq, 150, 0.06), i * 130);
    });
  }

  // ==========================================================
  // Утилиты
  // ==========================================================
  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shakeScreen() {
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 350);
  }

  function makeBar(pct) {
    const filled = Math.round(pct / 5);
    return '[' + '█'.repeat(filled) + '░'.repeat(20 - filled) + ']';
  }

  // ==========================================================
  // ЭФФЕКТ 13: Определение устройства с реальной моделью
  // ==========================================================
  async function detectDevice() {
    try {
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        const hints = await navigator.userAgentData.getHighEntropyValues([
          'model', 'platform', 'platformVersion'
        ]);
        if (hints.model && hints.model.trim() !== '') {
          return hints.model;
        }
      }
    } catch (e) {}

    const ua = navigator.userAgent;
    if (/iPad/.test(ua)) return 'tablet';
    if (/Macintosh/.test(ua) && 'ontouchend' in document) return 'tablet';
    if (/Android/.test(ua) && !/Mobile/.test(ua)) return 'tablet';
    if (/iPhone/.test(ua)) return 'phone';
    if (/Android/.test(ua) && /Mobile/.test(ua)) return 'phone';
    if (/Windows Phone/.test(ua)) return 'phone';
    if (/BlackBerry|BB10|Opera Mini|IEMobile/.test(ua)) return 'phone';
    if (/Windows NT/.test(ua)) return 'computer';
    if (/Macintosh/.test(ua)) return 'computer';
    if (/Linux/.test(ua) && !/Android/.test(ua)) return 'computer';
    if (/CrOS/.test(ua)) return 'computer';
    return 'computer';
  }

  function getRandomIP() {
    return '192.168.' + rand(0,255) + '.' + rand(0,255);
  }

  function getRandomGeo() {
    const cities = [
      'Москва, Россия',
      'Санкт-Петербург, Россия',
      'Казань, Россия',
      'Новосибирск, Россия'
    ];
    return cities[Math.floor(Math.random() * cities.length)];
  }

  async function buildDeviceInfo() {
    const device = await detectDevice();
    deviceInfo.textContent =
      'IP:         ' + getRandomIP() + '\n' +
      'Устройство: ' + device + '\n' +
      'Локация:    ' + getRandomGeo();
  }

  // ==========================================================
  // Обновление счётчика с автоподгонкой
  // ==========================================================
  function updateCounter(value) {
    const text = 'Удалено файлов: ' + value;
    fileCounter.textContent = text;
    fileCounter.style.fontSize = '14px';
    fileCounter.style.letterSpacing = '0px';

    let fontSize = 14;
    let letterSpacing = 0;
    while (
      (fileCounter.scrollWidth > fileCounter.clientWidth ||
       fileCounter.scrollHeight > fileCounter.clientHeight) &&
      fontSize > 9
    ) {
      fontSize -= 0.5;
      letterSpacing -= 0.1;
      fileCounter.style.fontSize = fontSize + 'px';
      fileCounter.style.letterSpacing = letterSpacing + 'px';
    }
  }

  // ==========================================================
  // Курсор
  // ==========================================================
  let cursorEl = null;
  function attachCursor() {
    if (cursorEl) cursorEl.remove();
    cursorEl = document.createElement('span');
    cursorEl.className = 'cursor';
    terminalScreen.appendChild(cursorEl);
  }

  // ==========================================================
  // Печатная машинка
  // ==========================================================
  function typeLine(text, cssClass, withBar) {
    return new Promise(resolve => {
      if (cursorEl) cursorEl.remove();

      const p = document.createElement('p');
      p.className = (cssClass === 'mixed') ? '' : cssClass;
      terminalScreen.appendChild(p);

      let fullHTML;
      if (cssClass === 'mixed') {
        fullHTML = '<span class="red">- Z.E.R.O.A.I</span> <span class="green">- запущен</span>';
      } else if (withBar && /^\-\s\d+%$/.test(text)) {
        const pct = parseInt(text.match(/\d+/)[0], 10);
        fullHTML = text + ' ' + makeBar(pct);
      } else {
        fullHTML = text;
      }

      const temp = document.createElement('div');
      temp.innerHTML = fullHTML;
      const chars = [];
      (function walk(node, cls) {
        for (const child of node.childNodes) {
          if (child.nodeType === 3) {
            for (const ch of child.textContent) chars.push({ ch, cls });
          } else if (child.nodeType === 1) {
            walk(child, child.className || cls);
          }
        }
      })(temp, '');

      const speed = speedMode ? 3 : 20;
      let idx = 0;

      function typeNext() {
        if (aborted) { resolve(); return; }
        if (idx >= chars.length) {
          attachCursor();
          resolve();
          return;
        }
        const { ch, cls } = chars[idx];
        if (p._spanClass !== cls) {
          const span = document.createElement('span');
          if (cls) span.className = cls;
          p.appendChild(span);
          p._spanClass = cls;
        }
        p.lastChild.textContent += ch;
        terminalScreen.scrollTop = terminalScreen.scrollHeight;
        idx++;
        const t = setTimeout(typeNext, speed);
        timeouts.push(t);
      }
      typeNext();
    });
  }

  // ==========================================================
  // ЭФФЕКТ 12: Список "украденных данных"
  // ==========================================================
  const stolenData = [
    ['Контакты:',          '247'],
    ['Фото и видео:',      '1 834'],
    ['Сообщения:',         '5 621'],
    ['Пароли и аккаунты:', '42'],
    ['Банковские данные:', '7'],
    ['История браузера:',  '12 480'],
    ['Голосовые записи:',  '318'],
    ['Геолокации:',        '4 026'],
  ];

  // ==========================================================
  // Таймлайн (5 минут)
  // ==========================================================
  const timeline = [
    ['- Запуск системы', 'green', 2000],

    ['- 0%',  'green', 5000],
    ['- 15%', 'green', 19000],
    ['- 26%', 'green', 33000],
    ['- 33%', 'green', 47000],
    ['- 52%', 'green', 61000],
    ['- 68%', 'green', 75000],
    ['- 82%', 'green', 89000],
    ['- 93%', 'green', 103000],
    ['- 99%', 'green', 117000],
    ['- 100%','green', 130000],

    ['- Система загружена', 'green', 136000],

    ['- Запуск антивируса Z.E.R.O.A.I v1.0', 'green', 142000],
    ['- Z.E.R.O.A.I - запущен', 'mixed', 148000],

    ['- Сканирование данных телефона...', 'green', 151000],

    ['', 'green', 153000],
    ['= ОБНАРУЖЕННЫЕ ДАННЫЕ =', 'red', 153500],
    ['', 'green', 154000],
  ];

  stolenData.forEach((item, i) => {
    timeline.push(['  ' + item[0].padEnd(22, ' ') + item[1], 'yellow', 155000 + i * 800]);
  });

  timeline.push(
    ['', 'green', 162000],
    ['- Обнаружено 247 заражённых файлов', 'red', 163000],
    ['- Угроза: Trojan.Win32.Agent', 'yellow', 163800],
    ['- Угроза: Spyware.Phone.Data', 'yellow', 164500],
    ['- Угроза: Ransomware.Crypto', 'yellow', 165200],

    ['- Удаление данных телефона', 'red', 167000, 'shake'],

    ['- 0%',  'green', 171000],
    ['- 15%', 'green', 184000],
    ['- 26%', 'green', 197000],
    ['- 33%', 'green', 210000],
    ['- 52%', 'green', 223000],
    ['- 68%', 'green', 236000],
    ['- 82%', 'green', 249000],
    ['- 93%', 'green', 262000],
    ['- 99%', 'green', 275000],
    ['- 100%','green', 282000],

    ['- Удаление данных успешно завершено!', 'green', 287000],
    ['- Вирус удален с устройства',          'green', 291000],
    ['- Закрытие программы',                 'green', 294000],
    ['- Программа закрыта',                  'red',   297000],
  );

  // ==========================================================
  // Счётчик
  // ==========================================================
  function startCounter() {
    if (counterTimer) clearInterval(counterTimer);
    counterTimer = setInterval(() => {
      const base = speedMode ? 800 : 5;
      fileCount = Math.min(fileCount + base, 10000);
      updateCounter(fileCount.toLocaleString('ru-RU'));
      if (fileCount >= 10000) stopCounter();
    }, 150);
  }

  function stopCounter() {
    if (counterTimer) clearInterval(counterTimer);
    counterTimer = null;
  }

  // ==========================================================
  // Планирование последовательности
  // ==========================================================
  function scheduleSequence() {
    const startTime = Date.now();

    timeline.forEach((item, i) => {
      const [text, cls, t, action] = item;
      const delay = Math.max(0, t - (Date.now() - startTime));

      const id = setTimeout(async () => {
        if (aborted) return;
        stoppedAt = i;

        if (text === '') {
          const p = document.createElement('p');
          p.textContent = ' ';
          terminalScreen.appendChild(p);
          terminalScreen.scrollTop = terminalScreen.scrollHeight;
          return;
        }

        await typeLine(text, cls, true);
        beep(1200, 40, 0.03);

        if (action === 'shake') shakeScreen();

        if (text === '- Удаление данных телефона') {
          deletionSound();
          startCounter();
        }
      }, delay);

      timeouts.push(id);
    });

    const finalId = setTimeout(finishSequence, 300000);
    timeouts.push(finalId);
  }

  function finishSequence() {
    stopCounter();
    fileCount = 10000;
    updateCounter('10 000');

    stopHum();
    successSound();

    setTimeout(() => {
      terminalScreen.style.display = 'none';
      topBar.style.display = 'none';
      speedupModal.style.display = 'none';
      document.body.style.background = '#000';

      setTimeout(() => {
        finalScreen.style.display = 'flex';
      }, 1000);
    }, 1500);
  }

  function resumeNormalSpeed() {
    speedMode = false;

    timeouts.forEach(id => clearTimeout(id));
    timeouts = [];

    const remaining = timeline.slice(stoppedAt + 1);

    let i = 0;
    function next() {
      if (aborted || i >= remaining.length) {
        if (i >= remaining.length) finishSequence();
        return;
      }
      const [text, cls, , action] = remaining[i];
      stoppedAt = stoppedAt + 1;

      if (text === '') {
        const p = document.createElement('p');
        p.textContent = ' ';
        terminalScreen.appendChild(p);
        i++;
        const t = setTimeout(next, 200);
        timeouts.push(t);
        return;
      }

      typeLine(text, cls, true).then(() => {
        beep(1200, 40, 0.03);
        if (action === 'shake') shakeScreen();
        i++;
        const t = setTimeout(next, 1500);
        timeouts.push(t);
      });
    }
    next();
  }

  function activateSpeedMode() {
    speedMode = true;

    if (counterTimer === null) {
      startCounter();
    }

    timeouts.forEach(id => clearTimeout(id));
    timeouts = [];

    const remaining = timeline.slice(stoppedAt + 1);
    const totalMs = 20000;
    const step = remaining.length > 1 ? totalMs / remaining.length : totalMs;

    remaining.forEach((item, i) => {
      const [text, cls, , action] = item;
      const delay = i * step;

      const id = setTimeout(async () => {
        if (aborted) return;
        stoppedAt = stoppedAt + 1;

        if (text === '') {
          const p = document.createElement('p');
          p.textContent = ' ';
          terminalScreen.appendChild(p);
          return;
        }

        await typeLine(text, cls, true);
        beep(1200, 20, 0.02);

        if (action === 'shake') shakeScreen();
      }, delay);

      timeouts.push(id);
    });

    const finalId = setTimeout(finishSequence, totalMs + 2000);
    timeouts.push(finalId);

    speedupBtn.textContent = '[ УСКОРЯЕТСЯ ]';
  }

  // ==========================================================
  // Обработчики
  // ==========================================================
  speedupBtn.addEventListener('click', () => {
    if (speedMode) {
      speedupTitle.innerHTML =
        'Остановить ускорение?<br>Процесс продолжится с текущего места';
      speedupYes.textContent = 'ОСТАНОВИТЬ';
      speedupNo.textContent  = 'ПРОДОЛЖИТЬ';
      speedupModal.style.display = 'flex';
    } else {
      speedupTitle.innerHTML =
        'Ускорение может работать некорректно.<br>Продолжить?';
      speedupYes.textContent = 'АКТИВИРОВАТЬ';
      speedupNo.textContent  = 'ОТКЛОНИТЬ';
      speedupModal.style.display = 'flex';
    }
  });

  speedupYes.addEventListener('click', () => {
    speedupModal.style.display = 'none';
    if (speedMode) {
      speedupBtn.textContent = '[ УСКОРИТЬ ]';
      resumeNormalSpeed();
    } else {
      activateSpeedMode();
    }
  });

  speedupNo.addEventListener('click', () => {
    speedupModal.style.display = 'none';
  });

  startBtn.addEventListener('click', async () => {
    initAudio();
    if (audioReady && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    startHum();

    warningScreen.style.display  = 'none';
    terminalScreen.style.display = 'block';

    await buildDeviceInfo();
    topBar.style.display = 'flex';
    fileCounter.style.display = 'block';
    updateCounter('0');
    speedupBtn.style.display = 'inline-block';

    stoppedAt = -1;
    scheduleSequence();
  });

  closeBtn.addEventListener('click', () => {
    try {
      window.close();
      setTimeout(() => {
        if (!document.hidden) showWarningExit();
      }, 300);
    } catch (e) {
      showWarningExit();
    }
  });

  function showWarningExit() {
    finalScreen.style.display = 'none';
    warningExit.style.display = 'flex';
  }
 </script>
</body>
 </html>
