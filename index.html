<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Внимание</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #0f0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
  }

  /* ---- Первый экран: предупреждение ---- */
  #warning-screen {
    max-width: 600px;
  }

  .alert-title {
    color: red;
    font-size: 28px;
    font-weight: bold;
    animation: blink 1s infinite;
    margin-bottom: 30px;
    line-height: 1.4;
  }

  .alert-text {
    color: #0f0;
    font-size: 18px;
    margin-bottom: 40px;
    line-height: 1.6;
  }

  #start-btn {
    background: red;
    color: #fff;
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    padding: 20px 40px;
    border: 3px solid #ff5555;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255,0,0,0.8);
    animation: pulse 1.5s infinite;
  }

  #start-btn:active {
    transform: scale(0.96);
  }

  @keyframes blink {
    50% { opacity: 0.15; }
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 25px rgba(255,0,0,0.8); }
    50%     { box-shadow: 0 0 45px rgba(255,0,0,1); }
  }

  /* ---- Второй экран: «терминал» ---- */
  #terminal-screen {
    display: none;
    width: 100%;
    height: 100vh;
    padding: 25px 20px;
    text-align: left;
    font-size: 16px;
    line-height: 1.7;
    overflow-y: auto;
  }

  #terminal-screen p {
    white-space: pre-wrap;
    word-break: break-word;
  }

  .green  { color: #0f0; }
  .red    { color: #ff2b2b; }

  /* ---- Третий экран: выход ---- */
  #exit-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  #exit-screen p {
    font-size: 20px;
    line-height: 1.6;
  }

  #exit-btn {
    background: #0f0;
    color: #000;
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    padding: 18px 45px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,255,0,0.7);
  }

  #exit-btn:active {
    transform: scale(0.96);
  }
</style>
</head>
<body>

  <!-- ЭКРАН 1 -->
  <div id="warning-screen">
    <div class="alert-title">⚠️ ВНИМАНИЕ ⚠️<br>ВАШ ТЕЛЕФОН ЗАРАЖЁН!</div>
    <div class="alert-text">
      Все ваши данные находятся под угрозой.<br>
      Нажмите на кнопку ниже, чтобы убрать вирус.
    </div>
    <button id="start-btn">УБРАТЬ ВИРУС</button>
  </div>

  <!-- ЭКРАН 2 -->
  <div id="terminal-screen"></div>

  <!-- ЭКРАН 3 -->
  <div id="exit-screen">
    <p class="green">✔ Операция завершена успешно</p>
    <p class="green">Ваше устройство в безопасности</p>
    <button id="exit-btn">ВЫЙТИ ИЗ САЙТА</button>
  </div>

<script>
  const warningScreen  = document.getElementById('warning-screen');
  const terminalScreen = document.getElementById('terminal-screen');
  const exitScreen     = document.getElementById('exit-screen');
  const startBtn       = document.getElementById('start-btn');
  const exitBtn        = document.getElementById('exit-btn');

  // Список строк: [текст, css-класс, задержка после появления (мс)]
  const script = [
    // --- Запуск системы ---
    ['- Запуск системы', 'green', 400],

    // --- Прогресс загрузки системы ---
    ['- 0%',  'green', 200],
    ['- 15%', 'green', 200],
    ['- 26%', 'green', 200],
    ['- 33%', 'green', 200],
    ['- 52%', 'green', 200],
    ['- 68%', 'green', 200],
    ['- 82%', 'green', 200],
    ['- 93%', 'green', 200],
    ['- 99%', 'green', 200],
    ['- 100%','green', 500],

    ['- Система загружена', 'green', 700],

    // --- Запуск «антивируса» ---
    ['- Запуск антивируса Z.E.R.O.A.I v1.0', 'green', 700],
    ['- Z.E.R.O.A.I - запущен', 'mixed', 700],

    // --- Удаление данных ---
    ['- Удаление данных телефона', 'red', 500],

    ['- 0%',  'green', 180],
    ['- 15%', 'green', 180],
    ['- 26%', 'green', 180],
    ['- 33%', 'green', 180],
    ['- 52%', 'green', 180],
    ['- 68%', 'green', 180],
    ['- 82%', 'green', 180],
    ['- 93%', 'green', 180],
    ['- 99%', 'green', 180],
    ['- 100%','green', 600],

    ['- Удаление данных успешно завершено!', 'green', 500],
    ['- Вирус удален с устройства',          'green', 500],
    ['- Закрытие программы',                 'green', 500],
    ['- Программа закрыта',                  'red',   800],
  ];

  // Функция, которая печатает одну строку
  function printLine(text, cssClass) {
    const p = document.createElement('p');

    // Особый случай: "Z.E.R.O.A.I" красным, "- запущен" зелёным
    if (cssClass === 'mixed') {
      p.innerHTML =
        '<span class="red">- Z.E.R.O.A.I</span> ' +
        '<span class="green">- запущен</span>';
    } else {
      p.className = cssClass;
      p.textContent = text;
    }

    terminalScreen.appendChild(p);
    // Автопрокрутка вниз
    terminalScreen.scrollTop = terminalScreen.scrollHeight;
  }

  // Запуск всей последовательности
  function runSequence() {
    let i = 0;

    function next() {
      if (i >= script.length) {
        // После последней строки — пауза и показ экрана выхода
        setTimeout(() => {
          terminalScreen.style.display = 'none';
          exitScreen.style.display = 'flex';
        }, 1200);
        return;
      }

      const [text, cls, delay] = script[i];
      printLine(text, cls);
      i++;
      setTimeout(next, delay);
    }

    next();
  }

  // Клик по «УБРАТЬ ВИРУС»
  startBtn.addEventListener('click', () => {
    warningScreen.style.display  = 'none';
    terminalScreen.style.display = 'block';
    runSequence();
  });

  // Клик по «ВЫЙТИ ИЗ САЙТА»
  exitBtn.addEventListener('click', () => {
    // Пытаемся закрыть вкладку
    window.close();
    // Если браузер не дал закрыть (обычно так и есть) —
    // показываем страницу-заглушку
    setTimeout(() => {
      document.body.innerHTML =
        '<div style="text-align:center;color:#0f0;font-family:monospace;font-size:22px;padding:40px">' +
        'Спасибо! Можете закрыть вкладку вручную.<br><br>' +
        '<span style="color:#ff2b2b">⚠️ Это была шутка. Никакого вируса нет.</span>' +
        '</div>';
    }, 300);
  });
</script>

</body>
  </html>
