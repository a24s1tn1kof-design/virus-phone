<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Внимание</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #0f0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
  }

  /* ===== CSS-иконка: треугольник с восклицательным знаком ===== */
  .warn-icon {
    display: inline-block;
    width: 44px;
    height: 44px;
    position: relative;
    vertical-align: middle;
    margin: 0 8px;
  }
  .warn-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    background: red;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .warn-icon::after {
    content: '!';
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #000;
    font-weight: bold;
    font-size: 22px;
    font-family: Arial, sans-serif;
  }

  /* ===== Иконка "крестик" для финала ===== */
  .cross-icon {
    display: inline-block;
    width: 32px;
    height: 32px;
    position: relative;
    vertical-align: middle;
    margin-right: 10px;
  }
  .cross-icon::before,
  .cross-icon::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 4px;
    background: #ff2b2b;
    border-radius: 2px;
  }
  .cross-icon::before { transform: rotate(45deg); }
  .cross-icon::after  { transform: rotate(-45deg); }

  /* ---- Экран 1: предупреждение ---- */
  #warning-screen { max-width: 640px; }

  .alert-title {
    color: red;
    font-size: 26px;
    font-weight: bold;
    animation: blink 1s infinite;
    margin-bottom: 30px;
    line-height: 1.6;
  }

  .alert-text {
    color: #0f0;
    font-size: 18px;
    margin-bottom: 40px;
    line-height: 1.6;
  }

  #start-btn {
    background: red;
    color: #fff;
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    padding: 20px 40px;
    border: 3px solid #ff5555;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255,0,0,0.8);
    animation: pulse 1.5s infinite;
  }
  #start-btn:active { transform: scale(0.96); }

  @keyframes blink { 50% { opacity: 0.15; } }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 25px rgba(255,0,0,0.8); }
    50%     { box-shadow: 0 0 45px rgba(255,0,0,1); }
  }

  /* ---- Экран 2: терминал ---- */
  #terminal-screen {
    display: none;
    width: 100%;
    height: 100vh;
    padding: 25px 20px;
    text-align: left;
    font-size: 16px;
    line-height: 1.7;
    overflow-y: auto;
  }

  #terminal-screen p {
    white-space: pre-wrap;
    word-break: break-word;
  }

  .green  { color: #0f0; }
  .red    { color: #ff2b2b; }

  /* ---- Экран 3: финал ---- */
  #final-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 25px;
  }

  #final-screen .final-text {
    color: #0f0;
    font-size: 26px;
    font-weight: bold;
    line-height: 1.5;
    display: flex;
    align-items: center;
    gap: 10px;
  }
</style>
</head>
<body>

  <!-- ЭКРАН 1 -->
  <div id="warning-screen">
    <div class="alert-title">
      <span class="warn-icon"></span>
      ВНИМАНИЕ
      <span class="warn-icon"></span>
      <br>
      ВАШ ТЕЛЕФОН ЗАРАЖЁН!
    </div>
    <div class="alert-text">
      Все ваши данные находятся под угрозой.<br>
      Нажмите на кнопку ниже, чтобы убрать вирус.
    </div>
    <button id="start-btn">УБРАТЬ ВИРУС</button>
  </div>

  <!-- ЭКРАН 2 -->
  <div id="terminal-screen"></div>

  <!-- ЭКРАН 3 -->
  <div id="final-screen">
    <div class="final-text">
      <span class="cross-icon"></span>
      Вирус удален! Закройте вкладку!
    </div>
  </div>

<script>
  const warningScreen  = document.getElementById('warning-screen');
  const terminalScreen = document.getElementById('terminal-screen');
  const finalScreen    = document.getElementById('final-screen');
  const startBtn       = document.getElementById('start-btn');

  /*
    ВАЖНО: время подобрано так, чтобы весь процесс шёл ~5 минут (300 сек).
    Считал: сумма всех задержек + пауза после 100% ≈ 300 000 мс.

    Хотите быстрее/медленнее — пропорционально меняйте числа.
    Например, чтобы уложиться в 2.5 минуты — поделите все числа на 2.
  */

  const script = [
    // === Запуск системы ===
    ['- Запуск системы', 'green', 3000],

    // === Прогресс загрузки системы (~2 мин) ===
    ['- 0%',  'green', 11000],
    ['- 15%', 'green', 11000],
    ['- 26%', 'green', 11000],
    ['- 33%', 'green', 11000],
    ['- 52%', 'green', 11000],
    ['- 68%', 'green', 11000],
    ['- 82%', 'green', 11000],
    ['- 93%', 'green', 11000],
    ['- 99%', 'green', 11000],
    ['- 100%','green', 4000],

    ['- Система загружена', 'green', 5000],

    // === Запуск антивируса ===
    ['- Запуск антивируса Z.E.R.O.A.I v1.0', 'green', 5000],
    ['- Z.E.R.O.A.I - запущен', 'mixed', 5000],

    // === Удаление данных ===
    ['- Удаление данных телефона', 'red', 5000],

    // Прогресс удаления (~2 мин)
    ['- 0%',  'green', 11000],
    ['- 15%', 'green', 11000],
    ['- 26%', 'green', 11000],
    ['- 33%', 'green', 11000],
    ['- 52%', 'green', 11000],
    ['- 68%', 'green', 11000],
    ['- 82%', 'green', 11000],
    ['- 93%', 'green', 11000],
    ['- 99%', 'green', 11000],
    ['- 100%','green', 4000],

    ['- Удаление данных успешно завершено!', 'green', 4000],
    ['- Вирус удален с устройства',          'green', 4000],
    ['- Закрытие программы',                 'green', 4000],
    ['- Программа закрыта',                  'red',   5000],
  ];

  function printLine(text, cssClass) {
    const p = document.createElement('p');
    if (cssClass === 'mixed') {
      p.innerHTML =
        '<span class="red">- Z.E.R.O.A.I</span> ' +
        '<span class="green">- запущен</span>';
    } else {
      p.className = cssClass;
      p.textContent = text;
    }
    terminalScreen.appendChild(p);
    terminalScreen.scrollTop = terminalScreen.scrollHeight;
  }

  function runSequence() {
    let i = 0;

    function next() {
      if (i >= script.length) {
        // Финальный экран
        setTimeout(() => {
          terminalScreen.style.display = 'none';
          finalScreen.style.display = 'flex';
        }, 1500);
        return;
      }
      const [text, cls, delay] = script[i];
      printLine(text, cls);
      i++;
      setTimeout(next, delay);
    }

    next();
  }

  startBtn.addEventListener('click', () => {
    warningScreen.style.display  = 'none';
    terminalScreen.style.display = 'block';
    runSequence();
  });
</script>

</body>
</html>
