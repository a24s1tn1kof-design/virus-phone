<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Внимание</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #0f0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0;
    overflow: hidden;
    position: relative;
  }

  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25%     { transform: translate(-4px, 3px); }
    50%     { transform: translate(4px, -3px); }
    75%     { transform: translate(-3px, -3px); }
  }
  body.shake { animation: shake 0.35s; }

  .warn-icon {
    display: inline-block;
    width: 44px; height: 44px;
    position: relative; vertical-align: middle; margin: 0 8px;
  }
  .warn-icon::before {
    content: ''; position: absolute; inset: 0;
    background: red; clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .warn-icon::after {
    content: '!'; position: absolute;
    top: 55%; left: 50%; transform: translate(-50%, -50%);
    color: #000; font-weight: bold; font-size: 22px;
    font-family: Arial, sans-serif;
  }

  .cross-icon {
    display: inline-block; width: 32px; height: 32px;
    position: relative; vertical-align: middle; margin-right: 10px;
  }
  .cross-icon::before, .cross-icon::after {
    content: ''; position: absolute; top: 50%; left: 0;
    width: 100%; height: 4px; background: #ff2b2b; border-radius: 2px;
  }
  .cross-icon::before { transform: rotate(45deg); }
  .cross-icon::after  { transform: rotate(-45deg); }

  /* Экран 1 */
  #warning-screen { max-width: 640px; padding: 20px; }
  .alert-title {
    color: red; font-size: 26px; font-weight: bold;
    animation: blink 1s infinite; margin-bottom: 30px; line-height: 1.6;
  }
  .alert-text {
    color: #0f0; font-size: 18px; margin-bottom: 40px; line-height: 1.6;
  }
  #start-btn {
    background: red; color: #fff; font-family: inherit;
    font-size: 20px; font-weight: bold; padding: 20px 40px;
    border: 3px solid #ff5555; border-radius: 12px; cursor: pointer;
    box-shadow: 0 0 25px rgba(255,0,0,0.8);
    animation: pulse 1.5s infinite;
  }
  #start-btn:active { transform: scale(0.96); }
  @keyframes blink { 50% { opacity: 0.15; } }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 25px rgba(255,0,0,0.8); }
    50%     { box-shadow: 0 0 45px rgba(255,0,0,1); }
  }

  /* Шапка */
  #top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 10px 14px; background: #000;
    display: none; flex-direction: column; gap: 8px;
  }
  #device-info {
    color: #0f0; font-size: 13px;
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,0.95); padding: 8px 12px;
    border: 1px solid #0f0; border-radius: 6px;
    text-align: left; line-height: 1.5; white-space: pre;
  }

  /* Ряд под IP-карточкой: кнопка слева, счётчик справа */
  #header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  #speedup-btn {
    display: none;
    background: transparent;
    color: #ffcc00;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    padding: 8px 14px;
    border: 1px solid #ffcc00;
    border-radius: 6px;
    cursor: pointer;
  }
  #speedup-btn:active { background: rgba(255,204,0,0.15); }

  #file-counter {
    color: #ff2b2b; font-size: 14px;
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,0.95); padding: 6px 12px;
    border: 1px solid #ff2b2b; border-radius: 6px;
    display: none;
  }

  /* Терминал */
  #terminal-screen {
    display: none; width: 100%; height: 100vh;
    padding: 190px 20px 40px 20px;
    text-align: left; font-size: 16px; line-height: 1.7;
    overflow-y: auto; scroll-behavior: smooth; position: relative;
  }
  #terminal-screen p {
    white-space: pre-wrap; word-break: break-word;
  }
  .green { color: #0f0; }
  .red   { color: #ff2b2b; }

  /* Курсор */
  .cursor {
    display: inline-block; width: 10px; height: 1em;
    background: #0f0; vertical-align: text-bottom;
    animation: cursorBlink 0.7s steps(1) infinite;
  }
  @keyframes cursorBlink { 50% { opacity: 0; } }

  /* Модалка */
  #speedup-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); z-index: 500;
    align-items: center; justify-content: center; padding: 20px;
  }
  #speedup-modal .box {
    background: #000; border: 2px solid #ffcc00;
    border-radius: 10px; padding: 25px 20px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 0 40px rgba(255,204,0,0.5);
  }
  #speedup-modal .box .title {
    color: #ffcc00; font-size: 16px; font-weight: bold;
    margin-bottom: 18px; line-height: 1.5;
  }
  #speedup-modal .box .buttons {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  }
  #speedup-modal button {
    font-family: inherit; font-size: 14px; font-weight: bold;
    padding: 12px 22px; border-radius: 8px; cursor: pointer; border: none;
  }
  #speedup-yes {
    background: #ffcc00; color: #000;
    box-shadow: 0 0 15px rgba(255,204,0,0.7);
  }
  #speedup-no {
    background: #222; color: #ff2b2b; border: 1px solid #ff2b2b;
  }
  #speedup-modal button:active { transform: scale(0.96); }

  /* Финал */
  #final-screen {
    display: none; flex-direction: column; align-items: center;
    gap: 25px; padding: 20px;
  }
  #final-screen .final-text {
    color: #0f0; font-size: 26px; font-weight: bold;
    line-height: 1.5; display: flex; align-items: center; gap: 10px;
  }
</style>
</head>
<body>

  <div id="warning-screen">
    <div class="alert-title">
      <span class="warn-icon"></span>
      ВНИМАНИЕ
      <span class="warn-icon"></span>
      <br>
      ВАШ ТЕЛЕФОН ЗАРАЖЁН!
    </div>
    <div class="alert-text">
      Все ваши данные находятся под угрозой.<br>
      Нажмите на кнопку ниже, чтобы убрать вирус.
    </div>
    <button id="start-btn">УБРАТЬ ВИРУС</button>
  </div>

  <div id="terminal-screen"></div>

  <div id="top-bar">
    <div id="device-info"></div>
    <div id="header-row">
      <button id="speedup-btn">[ УСКОРИТЬ ]</button>
      <div id="file-counter">Удалено файлов: 0</div>
    </div>
  </div>

  <div id="speedup-modal">
    <div class="box">
      <div class="title">
        Ускорение может работать некорректно.<br>
        Продолжить?
      </div>
      <div class="buttons">
        <button id="speedup-yes">АКТИВИРОВАТЬ</button>
        <button id="speedup-no">ОТКЛОНИТЬ</button>
      </div>
    </div>
  </div>

  <div id="final-screen">
    <div class="final-text">
      <span class="cross-icon"></span>
      Вирус удален! Закройте вкладку!
    </div>
    <button id="close-btn" style="
      margin-top:20px; background:#0f0; color:#000;
      font-family:inherit; font-size:18px; font-weight:bold;
      padding:16px 38px; border:none; border-radius:12px;
      cursor:pointer; box-shadow:0 0 20px rgba(0,255,0,0.7);
    ">ЗАКРЫТЬ ВКЛАДКУ</button>
  </div>

<script>
  // ==========================================================
  // Элементы
  // ==========================================================
  const warningScreen  = document.getElementById('warning-screen');
  const terminalScreen = document.getElementById('terminal-screen');
  const finalScreen    = document.getElementById('final-screen');
  const startBtn       = document.getElementById('start-btn');
  const closeBtn       = document.getElementById('close-btn');
  const topBar         = document.getElementById('top-bar');
  const fileCounter    = document.getElementById('file-counter');
  const deviceInfo     = document.getElementById('device-info');
  const speedupBtn     = document.getElementById('speedup-btn');
  const speedupModal   = document.getElementById('speedup-modal');
  const speedupYes     = document.getElementById('speedup-yes');
  const speedupNo      = document.getElementById('speedup-no');

  // ==========================================================
  // Состояние
  // ==========================================================
  let speedMode   = false;   // включён ли режим ускорения
  let aborted     = false;   // прерывание при уходе
  let timeouts    = [];      // все setTimeout, чтобы можно было чистить
  let counterTimer = null;

  // ==========================================================
  // Утилиты
  // ==========================================================
  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shakeScreen() {
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 350);
  }

  function makeBar(pct) {
    const filled = Math.round(pct / 5);
    return '[' + '█'.repeat(filled) + '░'.repeat(20 - filled) + ']';
  }

  // ==========================================================
  // Инфо об устройстве
  // ==========================================================
  function detectDeviceType() {
    const ua = navigator.userAgent;
    if (/iPad/.test(ua)) return 'tablet';
    if (/Macintosh/.test(ua) && 'ontouchend' in document) return 'tablet';
    if (/Android/.test(ua) && !/Mobile/.test(ua)) return 'tablet';
    if (/iPhone/.test(ua)) return 'phone';
    if (/Android/.test(ua) && /Mobile/.test(ua)) return 'phone';
    if (/Windows Phone/.test(ua)) return 'phone';
    if (/BlackBerry|BB10|Opera Mini|IEMobile/.test(ua)) return 'phone';
    if (/Windows NT/.test(ua)) return 'computer';
    if (/Macintosh/.test(ua)) return 'computer';
    if (/Linux/.test(ua) && !/Android/.test(ua)) return 'computer';
    if (/CrOS/.test(ua)) return 'computer';
    return 'computer';
  }

  function getRandomIP() {
    return '192.168.' + rand(0,255) + '.' + rand(0,255);
  }

  function getRandomGeo() {
    const cities = [
      'Москва, Россия', 'Санкт-Петербург, Россия',
      'Казань, Россия', 'Новосибирск, Россия'
    ];
    return cities[Math.floor(Math.random() * cities.length)];
  }

  function buildDeviceInfo() {
    deviceInfo.textContent =
      'IP:         ' + getRandomIP() + '\n' +
      'Устройство: ' + detectDeviceType() + '\n' +
      'Локация:    ' + getRandomGeo();
  }

  // ==========================================================
  // Курсор
  // ==========================================================
  let cursorEl = null;

  function attachCursor() {
    if (cursorEl) cursorEl.remove();
    cursorEl = document.createElement('span');
    cursorEl.className = 'cursor';
    terminalScreen.appendChild(cursorEl);
  }

  // ==========================================================
  // Эффект печатной машинки
  // ==========================================================
  function typeLine(text, cssClass, withBar) {
    return new Promise(resolve => {
      if (cursorEl) cursorEl.remove();

      const p = document.createElement('p');
      p.className = (cssClass === 'mixed') ? '' : cssClass;
      terminalScreen.appendChild(p);

      // Собираем видимые символы с их классами
      let fullHTML;
      if (cssClass === 'mixed') {
        fullHTML = '<span class="red">- Z.E.R.O.A.I</span> <span class="green">- запущен</span>';
      } else if (withBar && /^\-\s\d+%$/.test(text)) {
        const pct = parseInt(text.match(/\d+/)[0], 10);
        fullHTML = text + ' ' + makeBar(pct);
      } else {
        fullHTML = text;
      }

      const temp = document.createElement('div');
      temp.innerHTML = fullHTML;
      const chars = [];
      (function walk(node, cls) {
        for (const child of node.childNodes) {
          if (child.nodeType === 3) {
            for (const ch of child.textContent) chars.push({ ch, cls });
          } else if (child.nodeType === 1) {
            walk(child, child.className || cls);
          }
        }
      })(temp, '');

      // Скорость печати: 3 мс при ускорении, 20 мс обычно
      const speed = speedMode ? 3 : 20;
      let idx = 0;

      function typeNext() {
        if (aborted) { resolve(); return; }
        if (idx >= chars.length) {
          attachCursor();
          resolve();
          return;
        }
        const { ch, cls } = chars[idx];
        if (p._spanClass !== cls) {
          const span = document.createElement('span');
          if (cls) span.className = cls;
          p.appendChild(span);
          p._spanClass = cls;
        }
        p.lastChild.textContent += ch;
        terminalScreen.scrollTop = terminalScreen.scrollHeight;
        idx++;
        const t = setTimeout(typeNext, speed);
        timeouts.push(t);
      }
      typeNext();
    });
  }

  // ==========================================================
  // Сценарий
  // ==========================================================
  // Каждая строка: [текст, класс, время появления от старта (мс), action?]
  // Общая длительность: 300000 мс = 5 минут
  const timeline = [
    ['- Запуск системы', 'green', 2000],

    ['- 0%',  'green', 5000],
    ['- 15%', 'green', 19000],
    ['- 26%', 'green', 33000],
    ['- 33%', 'green', 47000],
    ['- 52%', 'green', 61000],
    ['- 68%', 'green', 75000],
    ['- 82%', 'green', 89000],
    ['- 93%', 'green', 103000],
    ['- 99%', 'green', 117000],
    ['- 100%','green', 130000],

    ['- Система загружена', 'green', 137000],

    ['- Запуск антивируса Z.E.R.O.A.I v1.0', 'green', 145000],
    ['- Z.E.R.O.A.I - запущен', 'mixed', 153000],

    ['- Удаление данных телефона', 'red', 161000, 'shake'],

    ['- 0%',  'green', 165000],
    ['- 15%', 'green', 178000],
    ['- 26%', 'green', 191000],
    ['- 33%', 'green', 204000],
    ['- 52%', 'green', 217000],
    ['- 68%', 'green', 230000],
    ['- 82%', 'green', 243000],
    ['- 93%', 'green', 256000],
    ['- 99%', 'green', 269000],
    ['- 100%','green', 282000],

    ['- Удаление данных успешно завершено!', 'green', 287000],
    ['- Вирус удален с устройства',          'green', 291000],
    ['- Закрытие программы',                 'green', 294000],
    ['- Программа закрыта',                  'red',   297000],
  ];

  // ==========================================================
  // Счётчик файлов (до 10 000)
  // ==========================================================
  let fileCount = 0;

  function startCounter() {
    if (counterTimer) clearInterval(counterTimer);

    // За 5 минут надо набрать 10 000 → ~33 файла в секунду.
    // Тик каждые 150 мс → ~5 файлов за тик.
    // При ускорении — быстрее.
    counterTimer = setInterval(() => {
      const base = speedMode ? 800 : 5;
      fileCount = Math.min(fileCount + base, 10000);
      fileCounter.textContent = 'Удалено файлов: ' + fileCount.toLocaleString('ru-RU');
      if (fileCount >= 10000) stopCounter();
    }, 150);
  }

  function stopCounter() {
    if (counterTimer) clearInterval(counterTimer);
    counterTimer = null;
  }

  // ==========================================================
  // Планирование строк по таймлайну
  // ==========================================================
  function scheduleSequence() {
    const startTime = Date.now();

    timeline.forEach(item => {
      const [text, cls, t, action] = item;
      const delay = Math.max(0, t - (Date.now() - startTime));

      const id = setTimeout(async () => {
        if (aborted) return;

        await typeLine(text, cls, true);

        if (action === 'shake') shakeScreen();

        // На строке "Удаление данных телефона" — включаем счётчик
        // и показываем кнопку "УСКОРИТЬ" в шапке
        if (text === '- Удаление данных телефона') {
          startCounter();
          speedupBtn.style.display = 'inline-block';
        }
      }, delay);

      timeouts.push(id);
    });

    // Финал
    const finalId = setTimeout(finishSequence, 300000); // ровно 5 минут
    timeouts.push(finalId);
  }

  // ==========================================================
  // Финал
  // ==========================================================
  function finishSequence() {
    stopCounter();
    fileCount = 10000;
    fileCounter.textContent = 'Удалено файлов: 10 000';

    setTimeout(() => {
      terminalScreen.style.display = 'none';
      topBar.style.display = 'none';
      speedupModal.style.display = 'none';
      document.body.style.background = '#000';

      setTimeout(() => {
        finalScreen.style.display = 'flex';
      }, 1000);
    }, 1500);
  }

  // ==========================================================
  // Ускорение: перепланируем оставшиеся строки на 20 секунд
  // ==========================================================
  function activateSpeedMode() {
    speedMode = true;

    // Очищаем все запланированные setTimeout
    timeouts.forEach(id => clearTimeout(id));
    timeouts = [];

    // Определяем, какие строки ещё не напечатаны
    const printedCount = terminalScreen.querySelectorAll('p').length;

    // Оставшиеся строки
    const remaining = timeline.slice(printedCount);

    // Растягиваем их на 20 секунд равномерно
    const totalMs = 20000;
    const step = remaining.length > 1 ? totalMs / remaining.length : totalMs;

    remaining.forEach((item, i) => {
      const [text, cls, , action] = item;
      const delay = i * step;

      const id = setTimeout(async () => {
        if (aborted) return;
        await typeLine(text, cls, true);
        if (action === 'shake') shakeScreen();
      }, delay);

      timeouts.push(id);
    });

    // Финал через 20 секунд + 2 секунды на печать последней строки
    const finalId = setTimeout(finishSequence, totalMs + 2000);
    timeouts.push(finalId);

    // Убираем кнопку ускорения, чтобы нельзя было нажать дважды
    speedupBtn.style.display = 'none';
  }

  // ==========================================================
  // Обработчики
  // ==========================================================
  speedupBtn.addEventListener('click', () => {
    speedupModal.style.display = 'flex';
  });

  speedupYes.addEventListener('click', () => {
    speedupModal.style.display = 'none';
    activateSpeedMode();
  });

  speedupNo.addEventListener('click', () => {
    speedupModal.style.display = 'none';
  });

  startBtn.addEventListener('click', () => {
    warningScreen.style.display  = 'none';
    terminalScreen.style.display = 'block';

    buildDeviceInfo();
    topBar.style.display = 'flex';
    fileCounter.style.display = 'block';
    fileCounter.textContent = 'Удалено файлов: 0';

    scheduleSequence();
  });

  closeBtn.addEventListener('click', () => {
    try { window.open('', '_self').close(); } catch(e) {}
    window.close();

    setTimeout(() => {
      document.body.innerHTML =
        '<div style="text-align:center;color:#0f0;' +
        'font-family:monospace;font-size:20px;padding:40px;line-height:1.7">' +
        'Браузер не разрешил закрыть вкладку автоматически.<br><br>' +
        'Закройте её вручную — крестиком или свайпом.' +
        '</div>';
    }, 400);
  });
</script>

</body>
 </html>
