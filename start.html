<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #0f0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
  }

  .container { max-width: 500px; width: 100%; }

  .shield-icon {
    width: 100px; height: 100px;
    margin: 0 auto 30px;
    position: relative;
  }
  .shield-icon::before {
    content: ''; position: absolute; inset: 0;
    background: #0f0;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    opacity: 0.15;
  }
  .shield-icon::after {
    content: ''; position: absolute; inset: 12px;
    background: #0f0;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    box-shadow: 0 0 30px rgba(0,255,0,0.6);
  }

  h1 {
    color: #0f0; font-size: 24px;
    margin-bottom: 15px; line-height: 1.4;
  }
  p {
    color: #888; font-size: 15px;
    margin-bottom: 40px; line-height: 1.6;
  }

  #check-btn {
    background: #0f0; color: #000;
    font-family: inherit; font-size: 18px; font-weight: bold;
    padding: 20px 40px; border: none; border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(0,255,0,0.7);
    animation: pulse 2s infinite;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; outline: none;
  }
  #check-btn:active { transform: scale(0.96); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 25px rgba(0,255,0,0.7); }
    50%     { box-shadow: 0 0 45px rgba(0,255,0,1); }
  }
</style>
</head>
<body>

  <div class="container">
    <div class="shield-icon"></div>
    <h1>Проверка безопасности</h1>
    <p>Нажмите кнопку ниже, чтобы проверить данные вашего телефона</p>
    <button id="check-btn">Проверить данные телефона</button>
  </div>

<script>
  document.getElementById('check-btn').addEventListener('click', () => {
    // 1. Открываем index.html в новой вкладке — это даёт право её закрыть
    window.open('index.html', '_blank');

    // 2. Уводим текущую вкладку start.html на главную Google Chrome
    //    (chrome://newtab — вкладка "Новая вкладка" в Chrome)
    //    Если браузер не поддерживает chrome:// — переходим на google.com
    try {
      window.location.href = 'chrome://newtab';
    } catch (e) {
      // браузер обычно не даёт перейти на chrome:// из скрипта
    }

    // 3. Через мгновение — на Google как запасной вариант
    setTimeout(() => {
      window.location.href = 'https://www.google.com';
    }, 100);
  });
</script>

</body>
</html>
